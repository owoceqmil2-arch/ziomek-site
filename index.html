<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#34eb7d">
  <meta property="og:title" content="ZIOMEK.EXE">
  <meta property="og:description" content="Siemano kolano! Odpal i zobacz, co się stanie.">
  <title>ZIOMEK.EXE</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      overflow: hidden; background: #111; color: #f7f7f7;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      cursor: crosshair;
    }
    #intro {
      min-height: 100vh; display: grid; place-items: center; text-align: center;
      padding: 24px; background: radial-gradient(circle at 50% 40%, #2c5139, #111 65%);
      transition: opacity .35s ease;
    }
    .intro-inner { max-width: 700px; }
    h1 { font-size: clamp(2.4rem, 9vw, 6rem); margin: 0 0 10px; line-height: .98; }
    h2 { font-size: clamp(1.1rem, 3vw, 1.7rem); margin: 12px 0; }
    p { line-height: 1.5; color: #d8d8d8; }
    .hint { color: #a9ffbf; }
    button {
      border: 0; border-radius: 12px; padding: 13px 19px; font-weight: 800;
      font-size: 1rem; cursor: pointer; background: #34eb7d; color: #07180d;
      box-shadow: 0 5px 0 #168340; margin: 8px;
    }
    button:hover { transform: translateY(-1px); }
    #arena { display: none; position: fixed; inset: 0; overflow: hidden; background: #080808; }
    .floater {
      position: absolute; max-width: min(34vw, 280px); max-height: 45vh;
      object-fit: contain; user-select: none; pointer-events: none;
      filter: drop-shadow(0 5px 9px #000b);
      animation: wobble var(--speed, 1.8s) ease-in-out infinite alternate;
    }
    .caption {
      position: absolute; color: #ff3030; font-weight: 1000;
      font-size: clamp(18px, 3vw, 38px); text-shadow: 2px 2px #fff, 4px 4px 10px #000;
      pointer-events: none; white-space: nowrap; animation: wobble 1s infinite alternate;
    }
    .flash { animation: flash .16s steps(2, end) infinite; }
    #stop {
      position: fixed; z-index: 10000; right: 12px; top: 12px; font-size: 13px;
      padding: 9px 12px; margin: 0; opacity: .85;
    }
    @keyframes wobble { from { transform: rotate(-12deg) scale(.92); } to { transform: rotate(13deg) scale(1.08); } }
    @keyframes flash { 0% { background:#080808; } 50% { background:#292929; } 100% { background:#080808; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 4s !important; } }
  </style>
</head>
<body>
  <main id="intro">
    <div class="intro-inner">
      <h1>SIEMANO KOLANO 💀</h1>
      <h2>Witaj na stronie twojego ulubionego problemu.</h2>
      <p class="hint">Walnij 3 razy w SPACJĘ albo kliknij przycisk.</p>
      <p>Uwaga: mogą pojawić się migające elementy i głośne dźwięki. Dźwięk uruchamia się dopiero po kliknięciu.</p>
      <button id="start">ODPAL CHAOS</button>
    </div>
  </main>
  <section id="arena" aria-label="Tryb chaosu">
    <button id="stop" type="button">STOP / WYJDŹ</button>
  </section>
  <script>
    const intro = document.querySelector('#intro');
    const arena = document.querySelector('#arena');
    const start = document.querySelector('#start');
    const stop = document.querySelector('#stop');
    let spaceCount = 0, active = false, spawnTimer, textTimer, audioCtx;
    const phrases = [
      'CO TY ROBISZ XDD', 'ZAMKNIJ OKNO 💀', 'ZIOMEK.exe', 'KTO TO ODPALIŁ',
      'ALE BYŁO', 'SYSTEM ZIOMKA PRZESTAŁ DZIAŁAĆ', 'XD XD XD', 'PATRZ ZA SIEBIE'
    ];
    // Dodaj zdjęcie jako assets/ziomek.jpg, a następnie zmień tę wartość na 'assets/ziomek.jpg'.
    const FRIEND_IMAGE = '';
    const fallbackFaces = ['💀','😭','🗿','🤨','🐸','🦆','🤡','🔥'];
    function random(min, max) { return Math.random() * (max - min) + min; }
    function playBeep() {
      try {
        audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'square'; osc.frequency.value = random(180, 950);
        gain.gain.value = 0.035;
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.09);
      } catch (_) {}
    }
    function makeFloater() {
      const el = document.createElement(FRIEND_IMAGE ? 'img' : 'div');
      el.className = FRIEND_IMAGE ? 'floater' : 'caption';
      if (FRIEND_IMAGE) { el.src = FRIEND_IMAGE; el.alt = 'Zdjęcie ziomka'; }
      else { el.textContent = fallbackFaces[Math.floor(Math.random()*fallbackFaces.length)]; el.style.fontSize = random(50, 150) + 'px'; }
      el.style.left = random(0, Math.max(0, innerWidth - 160)) + 'px';
      el.style.top = random(0, Math.max(0, innerHeight - 100)) + 'px';
      el.style.setProperty('--speed', random(.35, 2.4) + 's');
      arena.appendChild(el);
      if (arena.children.length > 65) arena.children[1]?.remove();
      if (Math.random() > .65) playBeep();
    }
    function makeText() {
      const el = document.createElement('div');
      el.className = 'caption';
      el.textContent = phrases[Math.floor(Math.random()*phrases.length)];
      el.style.left = random(0, Math.max(0, innerWidth - 330)) + 'px';
      el.style.top = random(0, Math.max(0, innerHeight - 70)) + 'px';
      el.style.transform = `rotate(${random(-25,25)}deg)`;
      arena.appendChild(el);
    }
    function begin() {
      if (active) return;
      active = true; intro.style.display = 'none'; arena.style.display = 'block';
      document.body.classList.add('flash');
      for (let i=0; i<10; i++) makeFloater();
      spawnTimer = setInterval(makeFloater, 360);
      textTimer = setInterval(makeText, 900);
    }
    function end() {
      active = false; clearInterval(spawnTimer); clearInterval(textTimer);
      arena.replaceChildren(stop); arena.style.display = 'none'; intro.style.display = 'grid';
      document.body.classList.remove('flash'); spaceCount = 0;
    }
    start.addEventListener('click', begin);
    stop.addEventListener('click', end);
    document.addEventListener('keydown', e => {
      if (e.code === 'Escape') end();
      if (e.code === 'Space' && !active) { e.preventDefault(); spaceCount++; if (spaceCount >= 3) begin(); }
    });
  </script>
</body>
</html>
